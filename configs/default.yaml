  n_frames: 60
  relabel_margin: 0.03

model:
  aggregation: gru
  input_dim: 23
  hidden_dim: 128
  dropout: 0.3
  freeze_backbone_phase1: false
  n_classes: 3

train:
  batch_size: 16                   # 从64降到16
  num_workers: 2                   # Windows建议更小,Linux可以4
  phase1_epochs: 50
  phase2_epochs: 0
  lr_phase1: 1.0e-3
  lr_backbone_phase2: 1.0e-5
  lr_classifier_phase2: 1.0e-4
  weight_decay: 1.0e-4
  use_class_weights: true
  early_stopping_patience: 3
  val_every_n_epochs: 1
  save_top_k: 3
  checkpoint_dir: checkpoints
  log_dir: runs
  seed: 42
  # 新增项
  gradient_accumulation_steps: 4   # 梯度累积,等效batch_size=64


eval:
  results_dir: results
  compute_cost:
    kalman: 0.05
    gmc: 0.15
    inference: 1.0
